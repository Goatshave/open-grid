<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800" role="img" aria-labelledby="title description">
  <title id="title">Open Grid brand directions</title>
  <desc id="description">Three complete brand directions shown as symbols, wordmarks, navigation marks, favicons, and social previews.</desc>
  <rect width="1600" height="1800" fill="#e9edea"/>
  <style>
    .eyebrow { font: 700 18px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; }
    .title { font: 720 48px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: -.035em; }
    .body { font: 400 21px Inter, ui-sans-serif, system-ui, sans-serif; }
    .small { font: 600 15px Inter, ui-sans-serif, system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <text x="72" y="72" class="eyebrow" fill="#54635d">OPEN GRID / BRAND EXPLORATION 01</text>
  <text x="72" y="128" class="title" fill="#0b241c">Three directions, tested in context</text>
  <text x="72" y="166" class="body" fill="#65736d">Each direction includes a compact mark, wordmark behavior, navigation use, favicon, and social preview.</text>

  <!-- Direction A -->
  <g transform="translate(72 220)">
    <rect width="1456" height="460" rx="12" fill="#f3f7f1"/>
    <rect width="12" height="460" rx="6" fill="#b5ef6f"/>
    <text x="52" y="54" class="eyebrow" fill="#66833f">01 / OPEN PATH</text>
    <text x="52" y="100" class="title" fill="#0b241c">One continuous route</text>
    <text x="52" y="137" class="body" fill="#56665f">Technical · infrastructural · confident</text>
    <g transform="translate(76 190) scale(1.55)">
      <path d="M108 16H16v96h64V48H48v32h64" fill="none" stroke="#0b241c" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M94 80h18" stroke="#6aae25" stroke-width="16" stroke-linecap="square"/>
    </g>
    <text x="342" y="265" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="70" font-weight="720" letter-spacing="-3" fill="#0b241c">Open Grid</text>
    <text x="346" y="313" class="body" fill="#5b6b64">One core. Native everywhere.</text>
    <g transform="translate(770 44)">
      <rect width="638" height="112" rx="8" fill="#111816"/>
      <g transform="translate(24 28) scale(.44)"><path d="M108 16H16v96h64V48H48v32h64" fill="none" stroke="#b5ef6f" stroke-width="16" stroke-linecap="square"/></g>
      <text x="92" y="67" class="small" fill="#f2f7ef">Open Grid</text>
      <text x="430" y="67" class="small" fill="#aeb9b5">Guide　Packages　GitHub</text>
    </g>
    <g transform="translate(770 180)">
      <rect width="80" height="80" rx="14" fill="#0b241c"/>
      <g transform="translate(12 12) scale(.44)"><path d="M108 16H16v96h64V48H48v32h64" fill="none" stroke="#b5ef6f" stroke-width="16" stroke-linecap="square"/></g>
      <text x="104" y="34" class="small" fill="#0b241c">FAVICON / 16–512 PX</text>
      <text x="104" y="61" class="body" fill="#68766f">Square terminals hold at small sizes.</text>
    </g>
    <g transform="translate(1080 180)">
      <rect width="328" height="210" rx="8" fill="#0b241c"/>
      <g stroke="#b5ef6f" opacity=".13"><path d="M0 70h328M0 140h328M82 0v210M164 0v210M246 0v210"/></g>
      <g transform="translate(24 35) scale(.75)"><path d="M108 16H16v96h64V48H48v32h64" fill="none" stroke="#b5ef6f" stroke-width="16" stroke-linecap="square"/></g>
      <text x="142" y="88" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="700" fill="#f2f7ef">Open Grid</text>
      <text x="143" y="120" class="small" fill="#b2c0ba">Production data grids</text>
    </g>
  </g>

  <!-- Direction B -->
  <g transform="translate(72 720)">
    <rect width="1456" height="460" rx="12" fill="#f8f5ee"/>
    <rect width="12" height="460" rx="6" fill="#315ef7"/>
    <text x="52" y="54" class="eyebrow" fill="#315ef7">02 / SHARED CORE</text>
    <text x="52" y="100" class="title" fill="#14213d">Three native edges, one center</text>
    <text x="52" y="137" class="body" fill="#647088">Modular · balanced · framework-neutral</text>
    <g transform="translate(76 190) scale(1.55)">
      <g fill="none" stroke="#14213d" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M52 20H20v32"/>
        <path d="M76 20h32v32"/>
        <path d="M100 76v32H28V76"/>
      </g>
      <rect x="56" y="56" width="16" height="16" fill="#ff5a36"/>
    </g>
    <text x="342" y="265" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="70" font-weight="650" letter-spacing="-3" fill="#14213d">Open Grid</text>
    <text x="346" y="313" class="body" fill="#68738a">Native renderers gathered around a shared core.</text>
    <g transform="translate(770 44)">
      <rect width="638" height="112" rx="8" fill="#fdfbf6" stroke="#d8d8d1"/>
      <g transform="translate(24 28) scale(.44)"><g fill="none" stroke="#14213d" stroke-width="13" stroke-linecap="square"><path d="M52 20H20v32"/><path d="M76 20h32v32"/><path d="M100 76v32H28V76"/></g><rect x="56" y="56" width="16" height="16" fill="#ff5a36"/></g>
      <text x="92" y="67" class="small" fill="#14213d">Open Grid</text>
      <text x="430" y="67" class="small" fill="#697389">Guide　Packages　GitHub</text>
    </g>
    <g transform="translate(770 180)">
      <rect width="80" height="80" rx="18" fill="#315ef7"/>
      <g transform="translate(12 12) scale(.44)"><g fill="none" stroke="#fff" stroke-width="13" stroke-linecap="square"><path d="M52 20H20v32"/><path d="M76 20h32v32"/><path d="M100 76v32H28V76"/></g><rect x="56" y="56" width="16" height="16" fill="#ffb198"/></g>
      <text x="104" y="34" class="small" fill="#14213d">FAVICON / 16–512 PX</text>
      <text x="104" y="61" class="body" fill="#68738a">Three open frames remain legible at small sizes.</text>
    </g>
    <g transform="translate(1080 180)">
      <rect width="328" height="210" rx="8" fill="#315ef7"/>
      <g transform="translate(18 18) scale(.8)" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="square"><path d="M52 20H20v32"/><path d="M76 20h32v32"/><path d="M100 76v32H28V76"/></g>
      <rect x="63" y="63" width="13" height="13" fill="#ffb198"/>
      <text x="42" y="165" font-family="Inter, ui-sans-serif, system-ui" font-size="29" font-weight="650" fill="#fff">Open Grid</text>
      <text x="42" y="192" class="small" fill="#dce4ff">Across every framework</text>
    </g>
  </g>

  <!-- Direction C -->
  <g transform="translate(72 1220)">
    <rect width="1456" height="460" rx="12" fill="#f6f1e7"/>
    <rect width="12" height="460" rx="6" fill="#ff5a36"/>
    <text x="52" y="54" class="eyebrow" fill="#d94526">03 / OPEN SYNTAX</text>
    <text x="52" y="100" class="title" fill="#161616">The name is the identity</text>
    <text x="52" y="137" class="body" fill="#67625a">Developer-native · typographic · direct</text>
    <g transform="translate(76 190) scale(1.55)">
      <g fill="none" stroke="#161616" stroke-width="13" stroke-linecap="square"><path d="M48 16H18v96h30"/><path d="M80 16h30v62"/></g>
      <g fill="#161616"><rect x="58" y="39" width="14" height="14"/><rect x="58" y="69" width="14" height="14"/></g>
      <path d="M80 112h36" stroke="#ff5a36" stroke-width="13" stroke-linecap="square"/>
    </g>
    <text x="342" y="265" class="mono" font-size="66" font-weight="700" letter-spacing="-4" fill="#161616">open:grid</text>
    <text x="346" y="313" class="body mono" fill="#6c675f">framework-agnostic by default_</text>
    <g transform="translate(770 44)">
      <rect width="638" height="112" rx="2" fill="#161616"/>
      <g transform="translate(24 28) scale(.44)"><g fill="none" stroke="#f6f1e7" stroke-width="13"><path d="M48 16H18v96h30"/><path d="M80 16h30v62"/></g><g fill="#f6f1e7"><rect x="58" y="39" width="14" height="14"/><rect x="58" y="69" width="14" height="14"/></g><path d="M80 112h36" stroke="#ff5a36" stroke-width="13"/></g>
      <text x="92" y="67" class="small mono" fill="#f6f1e7">open:grid</text>
      <text x="420" y="67" class="small mono" fill="#aaa69f">docs　packages　github</text>
    </g>
    <g transform="translate(770 180)">
      <rect width="80" height="80" rx="5" fill="#161616"/>
      <text x="17" y="54" class="mono" font-size="38" font-weight="700" fill="#ff5a36">[:</text>
      <text x="104" y="34" class="small" fill="#161616">FAVICON / 16–512 PX</text>
      <text x="104" y="61" class="body" fill="#6c675f">A compact syntax mark for developer surfaces.</text>
    </g>
    <g transform="translate(1080 180)">
      <rect width="328" height="210" rx="2" fill="#161616"/>
      <text x="34" y="72" class="mono" font-size="18" fill="#aaa69f">@open-grid/core</text>
      <text x="34" y="119" class="mono" font-size="38" font-weight="700" letter-spacing="-2" fill="#f6f1e7">open:grid</text>
      <rect x="34" y="146" width="168" height="6" fill="#ff5a36"/>
      <text x="34" y="184" class="small mono" fill="#aaa69f">one core / native everywhere</text>
    </g>
  </g>

  <text x="72" y="1750" class="small" fill="#65736d">Concept review only — no direction is approved or final.</text>
</svg>
