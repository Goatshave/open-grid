<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title description">
  <title id="title">Open Grid open path symbol</title>
  <desc id="description">A continuous open path crosses a quiet coordinate field.</desc>
  <style>
    .field { stroke: #0b241c; opacity: .09; }
    .mark { stroke: #0b241c; }
    .signal { stroke: #6aae25; }
    @media (prefers-color-scheme: dark) {
      .field { stroke: #b5ef6f; opacity: .12; }
      .mark { stroke: #eef7e8; }
      .signal { stroke: #b5ef6f; }
    }
  </style>
  <g class="field" fill="none" stroke-width="1">
    <path d="M0 70h360M0 180h360M0 290h360M70 0v360M180 0v360M290 0v360"/>
  </g>
  <g transform="translate(84 84) scale(1.5)" fill="none" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter">
    <path class="mark" d="M108 16H16v96h64V48H48v32h64"/>
    <path class="signal" d="M94 80h18"/>
  </g>
</svg>
