name: Open Grid Performance Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Record six-profile baseline
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Open Grid benchmark applications
        run: pnpm benchmark:build

      - name: Measure six-profile baseline
        run: pnpm benchmark:baseline:measure

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: open-grid-baseline-${{ github.sha }}
          path: .benchmark-results/baseline/
          if-no-files-found: error
          retention-days: 30
